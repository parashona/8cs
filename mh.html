<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For Second Prompt of MH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-start: #064e3b; 
      --bg-gradient-end: #020617;
      --card-bg: rgba(16, 185, 129, 0.05);
      --card-border: rgba(16, 185, 129, 0.2);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-heading: #ffffff;
      --accent-primary: #10b981; 
      --accent-hover: #34d399;
      --accent-success: #059669;
      --code-bg: rgba(0, 0, 0, 0.4);
      --shadow-color: rgba(0, 0, 0, 0.5);
      --input-bg: rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      flex-grow: 1;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-heading);
      letter-spacing: -1px;
      text-transform: uppercase;
    }

    /* Input Section Styles */
    .input-section {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 40px;
      box-shadow: 0 10px 40px var(--shadow-color);
      backdrop-filter: blur(12px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 650px) {
      .input-section {
        grid-template-columns: 1fr;
      }
    }

    .field-group {
      display: flex;
      flex-direction: column;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--accent-primary);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    textarea {
      width: 100%;
      padding: 14px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      transition: border-color 0.2s;
      min-height: 80px;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent-primary);
    }

    .prompts-stack {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    /* Prompt Card Styles */
    .prompt-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: 0 10px 40px var(--shadow-color);
      backdrop-filter: blur(12px);
      padding: 35px;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }

    .prompt-card:hover {
        transform: translateY(-5px);
        border-color: var(--accent-primary);
    }

    .prompt-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-primary);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .prompt-label::after {
      content: "";
      height: 1px;
      flex-grow: 1;
      background: var(--card-border);
    }

    .prompt-text {
      background-color: var(--code-bg);
      padding: 24px;
      border-radius: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.95rem;
      color: #ecfdf5;
      line-height: 1.5;
      margin-bottom: 30px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      max-height: 500px;
      overflow-y: auto;
    }
    
    /* Button Styles */
    .copy-button {
      align-self: flex-end;
      padding: 14px 28px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #ffffff;
      background-color: var(--accent-primary);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .copy-button:hover {
      background-color: var(--accent-hover);
      box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
    }

    .copy-button.copied {
      background-color: var(--accent-success);
    }

    .icon { width: 18px; height: 18px; }
    .copied-icon { display: none; }
    .copy-button.copied .copy-icon { display: none; }
    .copy-button.copied .copied-icon { display: inline-block; }

    footer {
        margin-top: 60px;
        text-align: center;
        color: var(--text-secondary);
        font-size: 0.85rem;
        padding-bottom: 40px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>For Second Prompt of MH</h1>
    </header>

    <div class="input-section">
      <div class="field-group">
        <label for="titleInput">Title:</label>
        <textarea id="titleInput" placeholder="Enter title..."></textarea>
      </div>
      <div class="field-group">
        <label for="subtitleInput">Sub-Title:</label>
        <textarea id="subtitleInput" placeholder="Enter sub-title..."></textarea>
      </div>
      <div class="field-group">
        <label for="sundryInput">Sundry Parts:</label>
        <textarea id="sundryInput" placeholder="Enter sundry parts..."></textarea>
      </div>
      <div class="field-group">
        <label for="outlineInput">Outline:</label>
        <textarea id="outlineInput" placeholder="Enter outline..."></textarea>
      </div>
    </div>

    <main class="prompts-stack">
      
      <!-- Prompt Card 1 -->
      <div class="prompt-card">
        <div class="prompt-label">Prompt #1</div>
        <pre id="prompt1Display" class="prompt-text">[Title]</pre>
        <button class="copy-button" onclick="copyText('prompt1Display', this)">
          <svg class="icon copy-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75" /></svg>
          <svg class="icon copied-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path d="M4.5 12.75l6 6 9-13.5" /></svg>
          <span class="button-text">Copy Prompt</span>
        </button>
      </div>

      <!-- Prompt Card 2 -->
      <div class="prompt-card">
        <div class="prompt-label">Prompt #2</div>
        <pre id="prompt2Display" class="prompt-text">Title:

[Title]

Sub-Title:

[Sub-Title]

[Sundry Parts]

Outline:

[Outline]</pre>
        <button class="copy-button" onclick="copyText('prompt2Display', this)">
          <svg class="icon copy-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75" /></svg>
          <svg class="icon copied-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path d="M4.5 12.75l6 6 9-13.5" /></svg>
          <span class="button-text">Copy Prompt</span>
        </button>
      </div>

    </main>

    <footer>
        Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.
    </footer>
  </div>

  <script>
    const inputs = {
      '[Title]': document.getElementById('titleInput'),
      '[Sub-Title]': document.getElementById('subtitleInput'),
      '[Sundry Parts]': document.getElementById('sundryInput'),
      '[Outline]': document.getElementById('outlineInput')
    };

    const prompt1Display = document.getElementById('prompt1Display');
    const prompt2Display = document.getElementById('prompt2Display');

    const basePrompt1 = prompt1Display.textContent;
    const basePrompt2 = prompt2Display.textContent;

    function updateDisplay() {
      let updated1 = basePrompt1;
      let updated2 = basePrompt2;

      for (const [placeholder, element] of Object.entries(inputs)) {
        const val = element.value.trim() || placeholder;
        updated1 = updated1.split(placeholder).join(val);
        updated2 = updated2.split(placeholder).join(val);
      }

      prompt1Display.textContent = updated1;
      prompt2Display.textContent = updated2;
    }

    Object.values(inputs).forEach(el => el.addEventListener('input', updateDisplay));

    function copyText(elementId, btn) {
      const text = document.getElementById(elementId).textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btnText = btn.querySelector('.button-text');
        const prevText = btnText.textContent;
        btnText.textContent = 'Copied!';
        btn.classList.add('copied');
        
        setTimeout(() => {
          btnText.textContent = prevText;
          btn.classList.remove('copied');
        }, 2000);
      });
    }
  </script>

</body>
</html>
